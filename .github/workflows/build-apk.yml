name: Build Pocket Speaker APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "beta43" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      POCKETSPEAKER_SIGNING_PASSWORD: ${{ secrets.POCKETSPEAKER_SIGNING_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Decrypt release signing key
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 \
            -in signing/pocketspeaker-release.p12.enc \
            -out signing/pocketspeaker-release.p12 \
            -pass env:POCKETSPEAKER_SIGNING_PASSWORD

      - name: Build signed test APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Read app version
        run: |
          VERSION_NAME=$(grep -oP "versionName '\\K[^']+" app/build.gradle)
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Prepare test APK
        run: cp app/build/outputs/apk/release/app-release.apk "PocketSpeaker-$VERSION_NAME.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketSpeaker-${{ env.VERSION_NAME }}-signed
          path: PocketSpeaker-${{ env.VERSION_NAME }}.apk

      - name: Stage signed APK for retrieval
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p ci-artifacts
          cp "PocketSpeaker-$VERSION_NAME.apk" "ci-artifacts/PocketSpeaker-$VERSION_NAME.apk"
          echo "$GITHUB_RUN_ID" > "ci-artifacts/beta59-run-id.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "ci-artifacts/PocketSpeaker-$VERSION_NAME.apk" "ci-artifacts/beta59-run-id.txt"
          git commit -m "CI: stage $VERSION_NAME APK [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mixtervee.pocketspeaker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mixtervee.pocketspeaker'
        minSdk 29
        targetSdk 35
        versionCode 9
        versionName '0.9.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

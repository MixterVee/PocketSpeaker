name: Build Pocket Speaker APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      POCKETSPEAKER_SIGNING_PASSWORD: ${{ secrets.POCKETSPEAKER_SIGNING_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Decrypt release signing key
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 \
            -in signing/pocketspeaker-release.p12.enc \
            -out signing/pocketspeaker-release.p12 \
            -pass env:POCKETSPEAKER_SIGNING_PASSWORD

      - name: Build signed test APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Prepare test APK
        run: cp app/build/outputs/apk/release/app-release.apk PocketSpeaker-v1.1.0-beta29.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketSpeaker-v1.1.0-beta29-signed
          path: PocketSpeaker-v1.1.0-beta29.apk

name: Build Beta5 USB Test

on:
  workflow_dispatch:
  push:
    branches: [ "beta5-usb-test" ]
    paths:
      - "app/**"
      - "windows/**"
      - ".github/workflows/build-beta5-usb-test.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      POCKETSPEAKER_SIGNING_PASSWORD: ${{ secrets.POCKETSPEAKER_SIGNING_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Decrypt release signing key
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 \
            -in signing/pocketspeaker-release.p12.enc \
            -out signing/pocketspeaker-release.p12 \
            -pass env:POCKETSPEAKER_SIGNING_PASSWORD

      - name: Build signed beta5 APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk PocketSpeaker-v1.1.0-beta5-USB-Test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketSpeaker-v1.1.0-beta5-USB-Test-Android
          path: PocketSpeaker-v1.1.0-beta5-USB-Test.apk

  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Create temporary Windows icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 256,256
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::FromArgb(24,28,34))
          $brush = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(81,196,133))
          $g.FillEllipse($brush,28,28,200,200)
          $font = New-Object System.Drawing.Font("Segoe UI",72,[System.Drawing.FontStyle]::Bold)
          $g.DrawString("PS",$font,[System.Drawing.Brushes]::White,43,72)
          $ico = [System.Drawing.Icon]::FromHandle($bmp.GetHicon())
          $fs = [System.IO.File]::Create("windows/app.ico")
          $ico.Save($fs)
          $fs.Close()
          $g.Dispose()
          $bmp.Dispose()

      - name: Publish first Windows sender
        shell: pwsh
        run: dotnet publish windows/PocketSpeaker.Windows.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o out

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PocketSpeaker-v1.1.0-beta5-USB-Test-Windows-x64
          path: out/*

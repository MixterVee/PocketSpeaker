plugins {
    id 'com.android.application'
}

def signingPassword = System.getenv("POCKETSPEAKER_SIGNING_PASSWORD")

android {
    namespace 'com.mixtervee.pocketspeaker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mixtervee.pocketspeaker'
        minSdk 29
        targetSdk 35
        versionCode 45
        versionName '1.1.0-beta32'
    }

    signingConfigs {
        release {
            if (signingPassword) {
                storeFile rootProject.file("signing/pocketspeaker-release.p12")
                storePassword signingPassword
                keyAlias 'pocketspeaker'
                keyPassword signingPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingPassword) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
